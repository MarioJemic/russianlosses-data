name: Sync verified public API

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: public-data-mirror
  cancel-in-progress: false

jobs:
  sync:
    if: github.repository == 'MarioJemic/russianlosses-data' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify and mirror the published API
        run: node .github/scripts/sync.mjs
      - name: Commit changed data only
        shell: bash
        run: |
          git add -- data/v1
          if git diff --cached --quiet; then
            echo 'Published API is unchanged.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Sync verified public API data'
          git push origin HEAD:main
